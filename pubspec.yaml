name: habits_app
description: "Daily/weekly habit tracker with streaks, plus a project time-tracking archive."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local persistence
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # State management
  provider: ^6.1.2

  # Date formatting / helpers
  intl: ^0.19.0

  # Persisting simple user choices (e.g. selected theme)
  shared_preferences: ^2.2.3

  # Shareable streak card (renders a widget to an image, then opens the
  # platform share sheet)
  share_plus: ^7.2.2

  # Daily/weekly recap notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates the Android launcher icon from assets/icon/app_icon.png.
  # Run after changing the source image:
  #   flutter pub get
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
